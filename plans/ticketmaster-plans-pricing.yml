specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Ticketmaster
providerId: ticketmaster
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Events
  - Tickets
  - Commerce
  - Discovery
description: Ticketmaster operates a freemium developer program. Registration grants immediate access
  to the Discovery and Commerce APIs at a default quota; higher volume and the Partner-only Discovery
  Feed are unlocked on a case-by-case basis after compliance and branding review. The provider does
  not publish a per-call price — the access tiers are gated by approval, not invoice.
sources:
  - https://developer.ticketmaster.com/products-and-docs/apis/getting-started/
  - https://developer.ticketmaster.com/support/faq/
plans:
  - id: ticketmaster-public
    name: Public (Default)
    type: freemium
    description: Default access for any registered developer. Includes the Discovery API and Commerce
      API at the standard quota.
    entries:
      - label: Daily Quota
        name: daily_quota
        type: quota
        metric: request
        limit: 5000
        timeFrame: day
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
      - label: Throughput
        name: requests_per_second
        type: tiered
        metric: request
        limit: 5
        timeFrame: second
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
    elements:
      - name: Discovery API
      - name: Commerce API
      - name: Public Documentation
  - id: ticketmaster-partner
    name: Partner
    type: enterprise
    description: Approved partners receive raised quotas and access to the Discovery Feed (no call restrictions,
      hourly refresh, JSON+CSV, includes resale and weekly newsletters). Approval requires verifying
      ToS, branding, and proper representation of Ticketmaster data.
    entries:
      - label: Raised Quota
        name: raised_quota
        type: quota
        metric: request
        limit: -1
        timeFrame: day
        geo: global
        unit: 1
        price: contact partner team
        userMultiplied: false
      - label: Discovery Feed
        name: discovery_feed
        type: flat
        metric: feed
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact partner team
        userMultiplied: false
    elements:
      - name: Discovery Feed (no call restrictions)
      - name: JSON and CSV formats
      - name: Resale Events Coverage
      - name: Weekly Newsletter
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
