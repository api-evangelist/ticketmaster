naftiko: 1.0.0-alpha2
info:
  label: Ticketmaster Event Discovery and Ticketing
  description: Unified capability for event discovery applications, travel platforms, and entertainment apps to search and
    display live events, venues, and artists from Ticketmaster alongside ticket availability and pricing. Combines the Discovery
    API for event search with the Commerce API for real-time ticket offers.
  tags:
  - Ticketmaster
  - Commerce
  - Entertainment
  - Events
  - Search
  - Tickets
  - Venues
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    TICKETMASTER_API_KEY: TICKETMASTER_API_KEY
capability:
  consumes:
  - type: http
    namespace: ticketmaster-discovery
    baseUri: https://app.ticketmaster.com/discovery/v2
    description: Ticketmaster Discovery REST API for event search
    authentication:
      type: apikey
      key: apikey
      value: '{{TICKETMASTER_API_KEY}}'
      placement: query
    resources:
    - name: events
      path: /events.json
      description: Event search and retrieval
      operations:
      - name: search-events
        method: GET
        description: Search for live events by keyword, location, date, and classification
        inputParameters:
        - name: keyword
          in: query
          type: string
          required: false
        - name: attractionId
          in: query
          type: string
          required: false
        - name: venueId
          in: query
          type: string
          required: false
        - name: classificationName
          in: query
          type: string
          required: false
        - name: countryCode
          in: query
          type: string
          required: false
        - name: stateCode
          in: query
          type: string
          required: false
        - name: city
          in: query
          type: string
          required: false
        - name: latlong
          in: query
          type: string
          required: false
        - name: radius
          in: query
          type: integer
          required: false
        - name: startDateTime
          in: query
          type: string
          required: false
        - name: endDateTime
          in: query
          type: string
          required: false
        - name: size
          in: query
          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-event
        method: GET
        description: Get details for a specific event
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: attractions
      path: /attractions.json
      description: Attraction search (artists, sports teams, etc.)
      operations:
      - name: search-attractions
        method: GET
        description: Search for attractions on Ticketmaster
        inputParameters:
        - name: keyword
          in: query
          type: string
          required: false
        - name: classificationName
          in: query
          type: string
          required: false
        - name: countryCode
          in: query
          type: string
          required: false
        - name: size
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-attraction
        method: GET
        description: Get details for a specific attraction
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: venues
      path: /venues.json
      description: Venue search and details
      operations:
      - name: search-venues
        method: GET
        description: Search for venues by name or location
        inputParameters:
        - name: keyword
          in: query
          type: string
          required: false
        - name: countryCode
          in: query
          type: string
          required: false
        - name: stateCode
          in: query
          type: string
          required: false
        - name: city
          in: query
          type: string
          required: false
        - name: latlong
          in: query
          type: string
          required: false
        - name: radius
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-venue
        method: GET
        description: Get details for a specific venue
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: classifications
      path: /classifications.json
      description: Event classifications (segments, genres, sub-genres)
      operations:
      - name: search-classifications
        method: GET
        description: Browse event classifications
        inputParameters:
        - name: keyword
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: suggest
      path: /suggest.json
      description: Search suggestions
      operations:
      - name: get-suggestions
        method: GET
        description: Get search autocomplete suggestions
        inputParameters:
        - name: keyword
          in: query
          type: string
          required: true
        - name: countryCode
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: ticketmaster-commerce
    baseUri: https://app.ticketmaster.com/commerce/v2
    description: Ticketmaster Commerce API for ticket offers and availability
    authentication:
      type: apikey
      key: apikey
      value: '{{TICKETMASTER_API_KEY}}'
      placement: query
    resources:
    - name: event-offers
      path: /events/{eventId}/offers.json
      description: Event ticket offers
      operations:
      - name: get-event-offers
        method: GET
        description: Get ticket offers and pricing for an event
        inputParameters:
        - name: eventId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: event-availability
      path: /events/{eventId}/availability.json
      description: Event ticket availability
      operations:
      - name: get-event-availability
        method: GET
        description: Get ticket availability status for an event
        inputParameters:
        - name: eventId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: ticketmaster-api
    description: Unified REST API for Ticketmaster event discovery and ticket commerce.
    resources:
    - path: /v1/events
      name: events
      description: Live event search
      operations:
      - method: GET
        name: search-events
        description: Search for live events by keyword, location, date, and genre
        call: ticketmaster-discovery.search-events
        with:
          keyword: rest.keyword
          countryCode: rest.countryCode
          city: rest.city
          startDateTime: rest.startDateTime
          endDateTime: rest.endDateTime
          classificationName: rest.classificationName
          size: rest.size
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/{id}
      name: event-detail
      description: Individual event details
      operations:
      - method: GET
        name: get-event
        description: Get details for a specific event
        call: ticketmaster-discovery.get-event
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/{eventId}/offers
      name: event-offers
      description: Ticket offers for an event
      operations:
      - method: GET
        name: get-event-offers
        description: Get ticket pricing and offers for an event
        call: ticketmaster-commerce.get-event-offers
        with:
          eventId: rest.eventId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/{eventId}/availability
      name: event-availability
      description: Ticket availability for an event
      operations:
      - method: GET
        name: get-event-availability
        description: Check ticket availability for an event
        call: ticketmaster-commerce.get-event-availability
        with:
          eventId: rest.eventId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/attractions
      name: attractions
      description: Artist and attraction search
      operations:
      - method: GET
        name: search-attractions
        description: Search for artists, sports teams, and other attractions
        call: ticketmaster-discovery.search-attractions
        with:
          keyword: rest.keyword
          classificationName: rest.classificationName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/venues
      name: venues
      description: Venue search
      operations:
      - method: GET
        name: search-venues
        description: Search for event venues by name or location
        call: ticketmaster-discovery.search-venues
        with:
          keyword: rest.keyword
          city: rest.city
          countryCode: rest.countryCode
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/suggest
      name: suggestions
      description: Search autocomplete
      operations:
      - method: GET
        name: get-suggestions
        description: Get autocomplete suggestions for event, venue, or attraction searches
        call: ticketmaster-discovery.get-suggestions
        with:
          keyword: rest.keyword
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: ticketmaster-mcp
    transport: http
    description: MCP server for AI-assisted live event discovery and ticket availability queries across the Ticketmaster platform.
    tools:
    - name: search-events
      description: Search for live events on Ticketmaster by keyword, city, country, date range, or classification (Music,
        Sports, Arts, Family)
      hints:
        readOnly: true
        openWorld: true
      call: ticketmaster-discovery.search-events
      with:
        keyword: tools.keyword
        countryCode: tools.countryCode
        city: tools.city
        startDateTime: tools.startDateTime
        endDateTime: tools.endDateTime
        classificationName: tools.classificationName
        size: tools.size
      outputParameters:
      - type: object
        mapping: $.
    - name: get-event
      description: Get full details for a specific Ticketmaster event including dates, venue, and prices
      hints:
        readOnly: true
        openWorld: true
      call: ticketmaster-discovery.get-event
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-event-ticket-offers
      description: Get ticket pricing tiers and purchase options for a specific Ticketmaster event
      hints:
        readOnly: true
        openWorld: true
      call: ticketmaster-commerce.get-event-offers
      with:
        eventId: tools.eventId
      outputParameters:
      - type: object
        mapping: $.
    - name: check-ticket-availability
      description: Check if tickets are still available for a Ticketmaster event
      hints:
        readOnly: true
        openWorld: true
      call: ticketmaster-commerce.get-event-availability
      with:
        eventId: tools.eventId
      outputParameters:
      - type: object
        mapping: $.
    - name: search-artists-and-attractions
      description: Search for artists, sports teams, and other attractions on Ticketmaster
      hints:
        readOnly: true
        openWorld: true
      call: ticketmaster-discovery.search-attractions
      with:
        keyword: tools.keyword
        classificationName: tools.classificationName
      outputParameters:
      - type: object
        mapping: $.
    - name: search-venues
      description: Find event venues near a city or geographic location
      hints:
        readOnly: true
        openWorld: true
      call: ticketmaster-discovery.search-venues
      with:
        keyword: tools.keyword
        city: tools.city
        countryCode: tools.countryCode
        latlong: tools.latlong
        radius: tools.radius
      outputParameters:
      - type: object
        mapping: $.
    - name: get-search-suggestions
      description: Get autocomplete suggestions while users type event or venue search queries
      hints:
        readOnly: true
        openWorld: true
      call: ticketmaster-discovery.get-suggestions
      with:
        keyword: tools.keyword
        countryCode: tools.countryCode
      outputParameters:
      - type: object
        mapping: $.
