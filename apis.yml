name: Ticketmaster
description: >-
  Ticketmaster is the world's largest live entertainment ticketing company, providing access to tickets for concerts,
  sports, theater, and other live events globally. Their developer platform offers APIs for event discovery, ticket
  commerce, venue data, and partner integrations, giving developers access to over 230,000 events across dozens of
  countries.
